services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ari_campus_ai
      POSTGRES_USER: ari
      POSTGRES_PASSWORD: ari_local_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ari -d ari_campus_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ari:ari_local_password@postgres:5432/ari_campus_ai
      FRONTEND_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
